<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메일 → 할 일 정리</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="bar">
    <h1>메일 → 할 일 정리</h1>
    <div class="ctrl">
      <label>데이터
        <select id="source">
          <option value="sample">샘플 메일 30통</option>
          <option value="imap">경희대 메일 (실제)</option>
        </select>
      </label>
      <span id="today" class="chip"></span>
      <span id="model" class="chip"></span>
      <label id="watch-wrap" class="chip hidden">
        <input type="checkbox" id="watch"> 새 메일 자동 감시
      </label>
      <span id="watch-state" class="chip hidden"></span>
      <button id="btn-fetch">메일 가져오기</button>
      <button id="btn-extract" class="primary">AI로 정리</button>
    </div>
  </div>
  <div id="newmail" class="newmail hidden"></div>
  <div id="notice" class="notice hidden"></div>
  <div id="status" class="status hidden"></div>
  <div id="counts" class="counts"></div>
</header>

<main>
  <div class="tools">
    <button id="btn-seen" class="mini">NEW 모두 지우기</button>
  </div>

  <details class="sec" data-sec="today" open>
    <summary><span class="stitle">오늘 할 일 3가지</span>
      <span class="badge" data-count="today"></span>
      <span class="new-badge hidden" data-new="today">NEW</span></summary>
    <div id="today-top" class="cards"></div>
  </details>

  <details class="sec" data-sec="review" open>
    <summary><span class="stitle">확인 필요</span>
      <span class="badge" data-count="review"></span>
      <span class="new-badge hidden" data-new="review">NEW</span></summary>
    <p class="hint">AI가 확신하지 못했거나 계산이 어긋난 항목입니다. 사라지지 않고 여기 남습니다.</p>
    <div id="review" class="list"></div>
  </details>

  <details class="sec" data-sec="upcoming" open>
    <summary><span class="stitle">마감 목록</span>
      <span class="badge" data-count="upcoming"></span>
      <span class="new-badge hidden" data-new="upcoming">NEW</span></summary>
    <div id="upcoming" class="list"></div>
  </details>

  <details class="sec" data-sec="anytime" open>
    <summary><span class="stitle">언제든 하면 되는 일</span>
      <span class="badge" data-count="anytime"></span>
      <span class="new-badge hidden" data-new="anytime">NEW</span></summary>
    <p class="hint">기한이 따로 없는 할 일입니다. 마감을 못 찾은 것이 아니라 원래 없는 것입니다.</p>
    <div id="anytime" class="list"></div>
  </details>

  <details class="sec" data-sec="verification" open>
    <summary><span class="stitle">인증·보안 메일</span>
      <span class="badge" data-count="verification"></span>
      <span class="new-badge hidden" data-new="verification">NEW</span></summary>
    <p class="hint">받는 즉시 쓰는 메일이라 할 일로 두지 않습니다. 필요할 때 여기서 찾으세요. 최신순.</p>
    <div id="verification" class="list"></div>
  </details>

  <details class="sec" data-sec="overdue">
    <summary><span class="stitle">지난 마감</span>
      <span class="badge" data-count="overdue"></span>
      <span class="new-badge hidden" data-new="overdue">NEW</span></summary>
    <div id="overdue" class="list"></div>
  </details>

  <details class="sec" data-sec="reference">
    <summary><span class="stitle">참고용 메일</span>
      <span class="badge" data-count="reference"></span></summary>
    <div id="reference" class="list"></div>
  </details>

  <details class="sec" data-sec="failed">
    <summary><span class="stitle">정리 실패</span>
      <span class="badge" data-count="failed"></span></summary>
    <div id="failed" class="list"></div>
  </details>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <strong id="m-subject"></strong>
      <button id="m-close">닫기</button>
    </div>
    <div id="m-meta" class="meta"></div>
    <div class="tabs">
      <button class="tab active" data-tab="raw">원문</button>
      <button class="tab" data-tab="masked">AI에 보낸 내용</button>
    </div>
    <pre id="m-body"></pre>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
